media:
  input: public/images
  output: /images

content:
  - name: posts
    label: Articles
    type: collection
    path: src/posts
    filename: "{fields.slug}.md"
    format: yaml-frontmatter
    view:
      primary: title
      fields: [title, date, category, published]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Titre
        type: string
        required: true
      - name: slug
        label: Adresse courte (slug)
        type: string
        required: true
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      - name: date
        label: Date de publication
        type: date
        required: true
      - name: category
        label: Rubrique
        type: string
        required: true
      - name: author
        label: Auteur
        type: string
        required: true
      - name: excerpt
        label: Résumé
        type: text
        required: true
      - name: image
        label: Image principale
        type: image
        required: false
      - name: published
        label: Publier sur le site
        type: boolean
      - name: body
        label: Texte de l’article
        type: rich-text
        options:
          format: markdown
          media: false
          switcher: true
